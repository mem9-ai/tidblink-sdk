name: SDK checks

on:
  pull_request:
  push:
    branches:
      - main
      - release
      - "release-*"

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - run: npm run test:service-contract
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:check
      - name: Show what this commit would release from a release branch
        run: node scripts/release-plan.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Build the wheel and import it in a clean environment
        run: |
          python -m pip install build
          python -m build --outdir dist
          python -m venv /tmp/consumer
          /tmp/consumer/bin/pip install dist/*.whl
          cd /tmp && /tmp/consumer/bin/python -c "import tidblink_server; print(tidblink_server.TIDB_LINK_REVISION)"
