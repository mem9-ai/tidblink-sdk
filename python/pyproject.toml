[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tidblink-server"
version = "0.1.0.dev0"
description = "Official Python SDK for TiDB Link backends"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=13.1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mem9-ai/tidblink-sdk"
Issues = "https://github.com/mem9-ai/tidblink-sdk/issues"
Source = "https://github.com/mem9-ai/tidblink-sdk/tree/main/python"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/tidblink_server"]

[tool.tidblink]
# The exact service baseline, as in typescript/package.json.
api-version = "0.0.1"
revision = "3e920bc73c754dce4cbd5782811063da770be290"
openapi-sha256 = "cfa915a6e1c143c00abf3a3554c4da805132742114d9125992d270551875185c"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
testpaths = ["tests"]
